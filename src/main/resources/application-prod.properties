# Production-only settings ? quiet logging, no SQL dump, strict CORS
logging.level.com.paasmart.backend=INFO
logging.level.org.hibernate.SQL=WARN
spring.jpa.show-sql=false

# When you deploy, set this to your real app domain(s), comma-separated
# e.g. https://app.passmart.com,https://admin.passmart.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}