spring.application.name=backend

server.port=8080

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.out-of-order=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=604800000

# fashn.ai.api-key=${FASHN_AI_API_KEY:}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

app.delivery.default-fee=45

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

springdoc.swagger-ui.path=/docs
management.endpoints.web.exposure.include=health

# notification

vapid.public-key=${VAPID_PUBLIC_KEY:}
vapid.private-key=${VAPID_PRIVATE_KEY:}
vapid.subject=mailto:support@paasmart.app

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Google OAuth ? shared across ALL apps (seller, customer, admin, delivery).
# Ek hi Google Cloud OAuth Client banao, usme har app ke redirect URIs add kar dena.
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}


# Email (for registration OTP verification) ? Gmail SMTP example.
# Gmail ke liye normal password nahi, "App Password" banana padega:
# https://myaccount.google.com/apppasswords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
mail.from-address=${MAIL_USERNAME:}

